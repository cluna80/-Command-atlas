[package]
name = "command-atlas"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone crate: not part of the engine workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
atlas-core = { path = "../engine/atlas-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true

# Smaller dev builds: the default full debug info makes the Windows linker run out of memory (LNK1102).
[profile.dev]
debug = false

[profile.dev.build-override]
debug = false
